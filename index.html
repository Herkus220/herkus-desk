<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Desk">
<meta name="theme-color" content="#000000">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Desk</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="app.css?v=5">
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="back" class="icon-btn hidden" aria-label="Back">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div id="title">Desk</div>
    <div id="badges"></div>
  </header>
  <div id="banner" class="hidden"></div>
  <main id="view" aria-live="polite">
    <div class="state-box"><div class="spinner"></div><div class="muted">Loading desk…</div></div>
  </main>
  <nav id="tabbar">
    <button data-tab="home" class="active"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
    <button data-tab="agents"><svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3.2"/><circle cx="16.5" cy="8" r="3.2"/><path d="M2.5 19c.6-3.3 2.9-5 5.5-5s4.9 1.7 5.5 5M12 19c.5-2.9 2.3-4.5 4.5-4.5s4.3 1.6 5 4.5"/></svg><span>Agents</span></button>
    <button data-tab="activity"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg><span>Activity</span></button>
    <button data-tab="account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.2 4.2-6.5 8-6.5s7 2.3 8 6.5"/></svg><span>Account</span></button>
  </nav>
</div>
<script src="chart.js?v=5"></script>
<script src="app.js?v=5"></script>
</body>
</html>
